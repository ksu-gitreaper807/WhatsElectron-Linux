name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, lint, unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  smoke-linux:
    name: Headless desktop smoke test (Xvfb + D-Bus + dunst)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install a minimal desktop stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 dunst xdotool libnotify-bin \
            libgtk-3-0 libnss3 libasound2t64 libgbm1 libxkbcommon0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Smoke test the real application
        run: npm run smoke
      - name: Package (dir target, verifies electron-builder config)
        run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-profile
          path: /tmp/wa-desktop-smoke-*
          if-no-files-found: ignore

  dist:
    name: Linux artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [checks, smoke-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build AppImage + deb + rpm
        run: npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artefacts
          path: release/*.AppImage
